<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота 5 — Завдання 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="task3">
  <main class="form-wrap">
    <h1>Анкета студента</h1>
    <p class="intro">Заповніть, будь ласка, основну інформацію про себе.</p>
    <form>
      <label for="fullname">Ім'я та прізвище</label>
      <input id="fullname" name="fullname" type="text" placeholder="Ваше ім'я" required>

      <label for="email">Електронна пошта</label>
      <input id="email" name="email" type="email" placeholder="name@example.com" required>

      <label for="birth">Дата народження</label>
      <input id="birth" name="birth" type="date">

      <label for="course">Курс навчання</label>
      <select id="course" name="course">
        <option value="">Оберіть курс</option>
        <option>1 курс</option><option>2 курс</option><option>3 курс</option><option>4 курс</option>
      </select>

      <fieldset>
        <legend>Форма навчання</legend>
        <label class="choice"><input type="radio" name="study" value="денна"> Денна</label>
        <label class="choice"><input type="radio" name="study" value="заочна"> Заочна</label>
      </fieldset>

      <label for="about">Коротко про себе</label>
      <textarea id="about" name="about" rows="4" placeholder="Ваші інтереси та захоплення"></textarea>

      <label class="choice"><input type="checkbox" name="confirm" required> Підтверджую правильність даних</label>
      <button type="submit">Надіслати анкету</button>
    </form>
  </main>
</body>
</html>
